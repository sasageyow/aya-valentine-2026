<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Aya 💘</title>

  <style>
    :root{
      --text:#eef2ff;
      --muted:rgba(238,242,255,.78);
      --card:rgba(8,12,24,.60);
      --stroke:rgba(255,255,255,.14);
      --yes1:#22c55e;
      --yes2:#16a34a;
      --no1:#ef4444;
      --no2:#b91c1c;
      --shadow: 0 22px 70px rgba(0,0,0,.55);
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }

    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color:var(--text);
      overflow:hidden;

      background-image:
        linear-gradient(180deg, rgba(0,0,0,.62), rgba(0,0,0,.62)),
        url("./1D99206C-5E5D-4D46-966D-3C1F7F198B49.jpeg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      display:grid;
      place-items:center;
      padding:24px;
    }

    .card{
      width:min(560px, 92vw);
      padding:30px 22px;
      border-radius:26px;
      background: var(--card);
      border:1px solid var(--stroke);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      position:relative;
    }

    h1{
      margin:0 0 10px;
      text-align:center;
      font-size:clamp(22px, 4vw, 34px);
      line-height:1.15;
      letter-spacing:.2px;
    }

    .subtitle{
      margin:0 0 18px;
      text-align:center;
      color:var(--muted);
      min-height:22px;
    }

    .playground{
      position:relative;
      width:100%;
      height:110px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .btn-row{
      display:flex;
      gap:12px;
      justify-content:center;
      align-items:center;
      flex-wrap:wrap;
      position:relative;
      z-index:1;
    }

    button{
      border:0;
      padding:12px 18px;
      border-radius:999px;
      font-weight:900;
      font-size:16px;
      cursor:pointer;
      user-select:none;
      transition:
        transform .18s ease,
        filter .18s ease,
        box-shadow .18s ease;
      will-change: transform;
    }
    button:active{ transform: scale(.98); }

    #yesBtn{
      color:#052012;
      background: linear-gradient(180deg, var(--yes1), var(--yes2));
      box-shadow: 0 12px 30px rgba(34,197,94,.28);
    }
    #yesBtn:hover{
      transform: translateY(-1px) scale(1.03);
      filter: brightness(1.05);
      box-shadow: 0 14px 36px rgba(34,197,94,.35);
    }

    #noBtn{
      color:#2a0a0a;
      background: linear-gradient(180deg, var(--no1), var(--no2));
      box-shadow: 0 12px 30px rgba(239,68,68,.24);
      position:absolute;
      left:50%;
      top:50%;
      transform: translate(-50%, -50%);
      touch-action: manipulation;
    }

    /* Modal popup */
    .modal{
      position:fixed;
      inset:0;
      display:none;
      place-items:center;
      padding:20px;
      background: rgba(0,0,0,.60);
      z-index:50;
    }
    .modal.show{ display:grid; }

    .modal-card{
      width:min(520px, 92vw);
      background: rgba(10,14,28,.78);
      border:1px solid rgba(255,255,255,.14);
      border-radius:22px;
      box-shadow: 0 26px 80px rgba(0,0,0,.60);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding:18px 16px 16px;
      text-align:center;
    }

    .modal-title{
      margin:6px 0 10px;
      font-size:22px;
      letter-spacing:.2px;
    }

    .modal-img{
      width:min(360px, 80vw);
      border-radius:16px;
      border:1px solid rgba(255,255,255,.14);
      box-shadow: 0 14px 40px rgba(0,0,0,.45);
      display:block;
      margin: 10px auto 14px;
    }

    .modal-actions{
      display:flex;
      justify-content:center;
      gap:10px;
      flex-wrap:wrap;
      margin-top:6px;
    }

    .closeBtn{
      background: rgba(255,255,255,.10);
      color: var(--text);
      border:1px solid rgba(255,255,255,.14);
      padding:10px 14px;
      border-radius:999px;
      font-weight:800;
    }
    .closeBtn:hover{ filter: brightness(1.08); }

    /* emoji pop */
    .pop{
      position:absolute;
      left:50%;
      top:10px;
      transform:translateX(-50%);
      font-size:28px;
      opacity:0;
      pointer-events:none;
      animation: pop 900ms ease forwards;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,.35));
    }
    @keyframes pop{
      0%{ transform:translateX(-50%) translateY(10px) scale(.6); opacity:0; }
      30%{ opacity:1; }
      100%{ transform:translateX(-50%) translateY(-18px) scale(1.1); opacity:0; }
    }
  </style>
</head>

<body>
  <main class="card" id="card">
    <h1>Aya, will you be my valentine?</h1>
    <p class="subtitle" id="subtitle">Be gentle… choose wisely 😌</p>

    <div class="playground" id="playground">
      <div class="btn-row">
        <button id="yesBtn" type="button">Yes</button>
      </div>
      <button id="noBtn" type="button">No</button>
    </div>
  </main>

  <!-- Popup / Modal -->
  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true">
      <div class="modal-title" id="modalTitle">YAY!! 💘</div>

      <!-- The image src will be switched by JS -->
      <img class="modal-img" id="modalImg" src="./yay.gif" alt="popup gif" />

      <div id="modalText" style="color: rgba(238,242,255,.80); margin-top:6px;">
        See you on Valentine’s 😚
      </div>

      <div class="modal-actions">
        <button class="closeBtn" id="closeBtn" type="button">Close</button>
      </div>
    </div>
  </div>

  <script>
    const subtitle   = document.getElementById("subtitle");
    const yesBtn     = document.getElementById("yesBtn");
    const noBtn      = document.getElementById("noBtn");
    const playground = document.getElementById("playground");
    const card       = document.getElementById("card");

    const modal      = document.getElementById("modal");
    const closeBtn   = document.getElementById("closeBtn");
    const modalTitle = document.getElementById("modalTitle");
    const modalImg   = document.getElementById("modalImg");
    const modalText  = document.getElementById("modalText");

    // --- Modal helpers ---
    function openModal({ title, imgSrc, text }) {
      modalTitle.textContent = title;
      modalImg.src = imgSrc;
      modalText.textContent = text;
      modal.classList.add("show");
      modal.setAttribute("aria-hidden","false");
    }
    function closeModal(){
      modal.classList.remove("show");
      modal.setAttribute("aria-hidden","true");
    }

    closeBtn.addEventListener("click", closeModal);
    modal.addEventListener("click", (e) => {
      if (e.target === modal) closeModal();
    });

    // --- YES hover + click ---
    yesBtn.addEventListener("mouseenter", () => {
      subtitle.textContent = "Good choice 😳💚";
      yesBtn.textContent = "YES!!!";
      pop("💚");
    });
    yesBtn.addEventListener("mouseleave", () => {
      subtitle.textContent = "Be gentle… choose wisely 😌";
      yesBtn.textContent = "Yes";
    });

    yesBtn.addEventListener("click", () => {
      popMany(["💘","💖","💞","💗"]);
      openModal({
        title: "YAY!! 💘",
        imgSrc: "./yay.gif",
        text: "See you on Valentine’s 😚"
      });
      resetIdleTimer(true); // prevent idle popup immediately after saying yes
    });

    // --- NO runs forever ---
    noBtn.addEventListener("mouseenter", () => {
      subtitle.textContent = "Nope nope nope 😌";
      pop("😤");
      dodge();
    });

    noBtn.addEventListener("touchstart", (e) => {
      e.preventDefault();
      subtitle.textContent = "Nice try 😈";
      pop("🏃‍♂️");
      dodge(true);
    }, { passive:false });

    document.addEventListener("mousemove", (e) => {
      const b = noBtn.getBoundingClientRect();
      const cx = b.left + b.width / 2;
      const cy = b.top  + b.height/ 2;
      const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
      if (dist < 120) dodge();
    });

    function dodge(extra=false){
      const pg = playground.getBoundingClientRect();
      const b  = noBtn.getBoundingClientRect();

      const padding = 10;
      const maxX = pg.width  - b.width  - padding;
      const maxY = pg.height - b.height - padding;

      let x = padding + Math.random() * Math.max(1, maxX - padding);
      let y = padding + Math.random() * Math.max(1, maxY - padding);

      if (extra) {
        x = clamp(x + (Math.random() < 0.5 ? -40 : 40), padding, maxX);
        y = clamp(y + (Math.random() < 0.5 ? -20 : 20), padding, maxY);
      }

      noBtn.style.left = x + "px";
      noBtn.style.top  = y + "px";

      noBtn.style.transform = "translate(-50%, -50%) scale(1.02)";
      setTimeout(() => {
        noBtn.style.transform = "translate(-50%, -50%) scale(1)";
      }, 120);
    }

    function clamp(n, min, max){ return Math.max(min, Math.min(max, n)); }
    window.addEventListener("load", () => dodge());

    // --- Emoji pop ---
    function pop(emoji){
      const el = document.createElement("div");
      el.className = "pop";
      el.textContent = emoji;
      card.appendChild(el);
      el.addEventListener("animationend", () => el.remove());
    }
    function popMany(emojis){
      let i = 0;
      const t = setInterval(() => {
        pop(emojis[i % emojis.length]);
        i++;
        if(i > 10) clearInterval(t);
      }, 120);
    }

    // --- Idle popup after 5 seconds with no action ---
    let idleTimer = null;
    let idleShown = false;

    function resetIdleTimer(forceBlock=false){
      if (forceBlock) idleShown = true; // prevents idle popup after YES
      clearTimeout(idleTimer);
      if (idleShown) return; // once shown (or blocked), don't show again
      idleTimer = setTimeout(() => {
        // If modal already open (e.g. YES), don't interrupt
        if (modal.classList.contains("show")) return;
        idleShown = true;
        openModal({
          title: "👀",
          imgSrc: "./idle.gif",
          text: ""
        });
      }, 5000);
    }

    // Count these as "action"
    const activityEvents = ["touchstart","touchmove","scroll","click","mousemove","keydown"];
    activityEvents.forEach(evt => {
      window.addEventListener(evt, () => resetIdleTimer(false), { passive:true });
    });

    // Start timer on load
    resetIdleTimer(false);
  </script>
</body>
</html>
